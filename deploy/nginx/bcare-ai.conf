# Reverse proxy TLS phía trước app (uvicorn chỉ nghe 127.0.0.1:8000).
# Cài: cp deploy/nginx/bcare-ai.conf /etc/nginx/sites-available/bcare-ai
#      ln -s /etc/nginx/sites-available/bcare-ai /etc/nginx/sites-enabled/
#
# Client là app mobile (IP đổi liên tục, nhiều máy chung 1 IP qua NAT nhà
# mạng) nên KHÔNG giới hạn theo IP ở firewall được, và rate limit theo IP phải
# để rộng: lớp chặn chính vẫn là token + quota + trần kết nối SSE trong app.

limit_req_zone  $binary_remote_addr zone=bcare_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=bcare_conn:10m;

# Access log KHÔNG ghi query string: /chat/stream?token=... mang token của user.
log_format bcare_noquery '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent $request_time "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt HTTP-01
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Tạm: chứng chỉ tự ký. Có domain thì certbot ghi đè 2 dòng này.
    ssl_certificate     /etc/nginx/ssl/bcare-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/bcare-selfsigned.key;

    # Mozilla "intermediate": TLS 1.2 + 1.3, đủ cho iOS ATS và Android 7+.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:bcare_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Body lớn nhất hợp lệ: content 2000 ký tự tiếng Việt (~8KB UTF-8) + JSON.
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    access_log /var/log/nginx/bcare_access.log bcare_noquery;
    error_log  /var/log/nginx/bcare_error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location = /chat/stream {
        limit_conn bcare_conn 20;
        proxy_pass http://127.0.0.1:8000;
        # SSE: không gom event, không cache, giữ kết nối lâu hơn trần sống của
        # app (SSE_MAX_CONNECTION_SECONDS=1800) — app tự đóng trước.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 2000s;
        proxy_send_timeout 2000s;
    }

    location /chat/ {
        limit_req zone=bcare_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;
    }

    # Số liệu chi phí/lưu lượng: chỉ đọc từ chính server (vd qua SSH tunnel).
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        return 404;
    }
}

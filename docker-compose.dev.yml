# CHỈ DÀNH CHO MÁY DEV: mở Postgres/Redis/Kafka ra 127.0.0.1 để chạy app hoặc
# test ngoài Docker. Không dùng file này trên server.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Tất cả đều bind 127.0.0.1 chứ không phải 0.0.0.0: Docker publish port qua
# iptables, vượt qua firewall của host.

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  kafka:
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
